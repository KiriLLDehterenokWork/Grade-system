<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold">Панель Администратора</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Выйти</button>
        </form>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4 mb-4">
        <!-- Группы -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Учебные группы</h5>
                    <form th:action="@{/admin/groups}" method="post" class="d-flex gap-2 mb-3">
                        <input type="text" name="name" class="form-control" placeholder="Название группы" required>
                        <button class="btn btn-primary">Добавить</button>
                    </form>
                    <ul class="list-group">
                        <li class="list-group-item" th:each="g : ${groups}" th:text="${g.name}"></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Предметы</h5>
                    <form th:action="@{/admin/subjects}" method="post" class="d-flex gap-2 mb-3">
                        <input type="text" name="name" class="form-control" placeholder="Название предмета" required>
                        <button class="btn btn-primary">Добавить</button>
                    </form>
                    <ul class="list-group">
                        <li class="list-group-item" th:each="s : ${subjects}" th:text="${s.name}"></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Учителя -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Добавить учителя</h5>
                    <form th:action="@{/admin/teachers}" method="post" class="mb-4">
                        <div class="mb-2">
                            <input type="text" name="fullName" class="form-control" placeholder="ФИО учителя" required>
                        </div>
                        <div class="row mb-2">
                            <div class="col">
                                <input type="text" name="username" class="form-control" placeholder="Логин" required>
                            </div>
                            <div class="col">
                                <input type="password" name="password" class="form-control" placeholder="Пароль" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Закрепленные предметы (зажмите Ctrl):</label>
                            <select name="subjectIds" class="form-select" multiple required>
                                <option th:each="sub : ${subjects}" th:value="${sub.id}" th:text="${sub.name}"></option>
                            </select>
                        </div>
                        <button class="btn btn-primary w-100">Создать учителя</button>
                    </form>

                    <h6 class="fw-bold text-muted text-uppercase mb-3">Список учителей</h6>
                    <table class="table table-sm align-middle">
                        <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Логин</th>
                            <th>Предметы</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${teachers}">
                            <td th:text="${t.fullName}"></td>
                            <td th:text="${t.username}"></td>
                            <td>
                                <span th:each="s : ${t.subjects}" th:text="${s.name}" class="badge bg-primary me-1"></span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/admin/users/{id}/delete(id=${t.id})}" method="post">
                                    <button class="btn btn-outline-danger btn-sm">Х</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Добавить студента</h5>
                    <form th:action="@{/admin/students}" method="post" class="mb-4">
                        <div class="mb-2">
                            <input type="text" name="fullName" class="form-control" placeholder="ФИО студента" required>
                        </div>
                        <div class="row mb-2">
                            <div class="col">
                                <input type="text" name="username" class="form-control" placeholder="Логин" required>
                            </div>
                            <div class="col">
                                <input type="password" name="password" class="form-control" placeholder="Пароль" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Учебная группа:</label>
                            <select name="groupId" class="form-select" required>
                                <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}"></option>
                            </select>
                        </div>
                        <button class="btn btn-primary w-100">Создать студента</button>
                    </form>

                    <h6 class="fw-bold text-muted text-uppercase mb-3">Список студентов</h6>
                    <table class="table table-sm align-middle">
                        <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Логин</th>
                            <th>Группа</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="st : ${students}">
                            <td th:text="${st.fullName}"></td>
                            <td th:text="${st.username}"></td>
                            <td th:text="${st.studyGroup != null ? st.studyGroup.name : '-'}"></td>
                            <td class="text-end">
                                <form th:action="@{/admin/users/{id}/delete(id=${st.id})}" method="post">
                                    <button class="btn btn-outline-danger btn-sm">Х</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
