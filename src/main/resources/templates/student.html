<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кабинет студента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold">
            Студент: <span th:text="${student.fullName}"></span>
            <span class="fs-6 fw-normal opacity-75">(<span th:text="${student.studyGroup != null ? student.studyGroup.name : 'Без группы'}"></span>)</span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Выйти</button>
        </form>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4 mb-4">
        <!-- Блок со средним баллом -->
        <div class="col-md-4">
            <div class="card text-center h-100 border-primary" style="border-width: 2px !important;">
                <div class="card-body d-flex flex-column justify-content-center py-5">
                    <h6 class="text-muted fw-bold text-uppercase tracking-wide">Общий средний балл</h6>
                    <h1 class="display-3 fw-bold text-primary mb-0" th:text="${overallAverage}">0.0</h1>
                </div>
            </div>
        </div>

        <!-- Средний балл по предметам -->
        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold mb-4">Успеваемость по предметам</h5>
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Дисциплина</th>
                            <th class="text-end">Средний балл</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${subjectAverages}">
                            <td class="fw-medium text-dark" th:text="${entry.key}"></td>
                            <td class="text-end"><span class="badge bg-primary fs-6 px-3" th:text="${entry.value}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Детальная история -->
    <div class="card">
        <div class="card-body">
            <h5 class="card-title fw-bold mb-4">Детализация всех оценок</h5>
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Дата</th>
                    <th>Предмет</th>
                    <th class="text-center">Оценка</th>
                    <th>Преподаватель</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${grades}">
                    <td class="text-muted small" th:text="${g.gradeDate}"></td>
                    <td class="fw-medium text-dark" th:text="${g.subject.name}"></td>
                    <td class="text-center"><strong class="fs-5 text-primary" th:text="${g.value}"></strong></td>
                    <td class="text-muted" th:text="${g.teacher.fullName}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
