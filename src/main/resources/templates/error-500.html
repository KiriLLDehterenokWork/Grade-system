<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка 500 - Внутренняя ошибка сервера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<div class="text-center">
    <h1 class="display-1 fw-bold text-danger">500</h1>
    <h2 class="mb-4">Внутренняя ошибка сервера</h2>
    <p class="text-muted mb-4">Что-то пошло не так на нашей стороне. Мы уже работаем над этим.</p>

    <div th:if="${errorMessage}" class="alert alert-danger d-inline-block text-start mb-4">
        <strong>Детали:</strong> <span th:text="${errorMessage}"></span>
    </div>
    <br>
    <a href="/" class="btn btn-primary">Вернуться на главную</a>
</div>
</body>
</html>
