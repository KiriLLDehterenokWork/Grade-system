<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кабинет преподавателя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold">Преподаватель: <span th:text="${teacher.fullName}"></span></span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Выйти</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title fw-bold mb-3">Выставить оценку</h5>
            <form th:action="@{/teacher/grades}" method="post" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold text-uppercase">Студент</label>
                    <select name="studentId" class="form-select" required>
                        <option th:each="st : ${students}" th:value="${st.id}"
                                th:text="${st.fullName + ' (' + (st.studyGroup != null ? st.studyGroup.name : 'Без группы') + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold text-uppercase">Предмет</label>
                    <select name="subjectId" class="form-select" required>
                        <option th:each="sub : ${subjects}" th:value="${sub.id}" th:text="${sub.name}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-bold text-uppercase">Оценка</label>
                    <input type="number" name="value" min="1" max="10" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-bold text-uppercase">Дата</label>
                    <input type="date" name="gradeDate" th:value="${today}" class="form-control" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100 fw-bold fs-5">+</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title fw-bold mb-4">Журнал выставленных оценок</h5>
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Студент</th>
                    <th>Группа</th>
                    <th>Предмет</th>
                    <th>Редактирование</th>
                    <th class="text-end">Действие</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${grades}">
                    <td class="fw-bold" th:text="${g.student.fullName}"></td>
                    <td th:text="${g.student.studyGroup != null ? g.student.studyGroup.name : '-'}"></td>
                    <td th:text="${g.subject.name}"></td>
                    <td>
                        <form th:action="@{/teacher/grades/{id}/update(id=${g.id})}" method="post" class="d-flex gap-2">
                            <input type="number" name="value" th:value="${g.value}" min="1" max="10" class="form-control form-control-sm" style="width: 70px;" required>
                            <input type="date" name="gradeDate" th:value="${g.gradeDate}" class="form-control form-control-sm" style="width: 140px;" required>
                            <button type="submit" class="btn btn-primary btn-sm">Сохранить</button>
                        </form>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/teacher/grades/{id}/delete(id=${g.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Удалить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
