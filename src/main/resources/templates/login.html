<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4">Учёт оценок студентов</h4>

                    <div th:if="${param.error}" class="alert alert-danger py-2">
                        Неверный логин или пароль!
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info py-2">
                        Вы успешно вышли из системы.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Логин</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>

                    <hr>
                    <div class="small text-muted">
                        <strong>Тестовые аккаунты:</strong><br>
                        Админ: <code>admin / admin123</code><br>
                        Учитель: <code>teacher / teacher123</code><br>
                        Студент: <code>student / student123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
